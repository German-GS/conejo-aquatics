services:
  postgres_db:
    image: arm64v8/postgres:15
    container_name: conejo-aquatics-db
    restart: always
    environment:
      POSTGRES_DB: conejo_aquatics_dev
      POSTGRES_USER: admin
      # La contraseña se toma de la variable de entorno / archivo .env (ver .env.example).
      # Falla explícitamente si no está definida.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en un archivo .env (ver .env.example)}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
